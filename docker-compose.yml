version: "3.8"

services:
  openwrt-backup:
    build: .
    container_name: openwrt-backup
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
      - ./backups:/backups
    environment:
      - OPENWRT_BACKUP_HOST=0.0.0.0
      - OPENWRT_BACKUP_PORT=5000
      - OPENWRT_BACKUP_DATA_DIR=/data
      - OPENWRT_BACKUP_DIR=/backups
      - OPENWRT_BACKUP_USE_WAITRESS=true
      # 通知Webhook (可选)
      - OPENWRT_NOTIFY_WEBHOOK=
      # API令牌 (用于外部访问)
      - OPENWRT_API_TOKEN=openwrt-backup-token
    restart: unless-stopped
